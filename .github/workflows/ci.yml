name: CI

# ตรวจโค้ด (build/typecheck ทั้ง frontend + backend)
# ปรับเป็น manual อย่างเดียว (workflow_dispatch) ระหว่างย้าย Azure -> AWS เพื่อไม่ให้รันอัตโนมัติทุก push/PR (ประหยัด Actions minutes)
# เปิด auto (push/pull_request) อีกครั้งได้เมื่อระบบนิ่งและมี CD (AWS) พร้อม
# ไม่ deploy (การ deploy จะอยู่ใน workflow CD สำหรับ AWS แยกต่างหาก)
on:
  workflow_dispatch:

jobs:
  backend:
    name: Backend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prisma generate + validate
        env:
          # validate ตรวจแค่ schema syntax ไม่ได้ต่อ DB จริง — ใส่ค่า dummy ให้ env ผ่าน
          DATABASE_URL: "file:./ci.db"
        run: |
          npx prisma generate
          npx prisma validate
      - name: Build (tsc)
        run: npm run build

  frontend:
    name: Frontend build & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (tsc -b + vite build)
        run: npm run build
